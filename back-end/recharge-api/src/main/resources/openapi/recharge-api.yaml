openapi: 3.0.3
info:
  title: Mobile Phone Recharge API
  description: API REST de recarga de celular com autenticação JWT
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Auth
    description: Autenticação e registro de usuários
  - name: Recharges
    description: Operações de recarga de celular

paths:
  /api/auth/register:
    post:
      tags:
        - Auth
      summary: Registrar usuário
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Usuário registrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: E-mail já cadastrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Login — retorna JWT
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login bem-sucedido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/auth/refresh:
    post:
      tags:
        - Auth
      summary: Renovar token JWT
      operationId: refreshToken
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/recharges:
    post:
      tags:
        - Recharges
      summary: Criar recarga
      operationId: createRecharge
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRechargeRequest'
      responses:
        '202':
          description: Recarga aceita para processamento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechargeResponse'
        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Não autenticado
    get:
      tags:
        - Recharges
      summary: Histórico de recargas do usuário (paginado)
      operationId: getRechargeHistory
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Lista paginada de recargas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechargePageResponse'
        '401':
          description: Não autenticado

  /api/recharges/{id}:
    get:
      tags:
        - Recharges
      summary: Detalhe de uma recarga
      operationId: getRechargeById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalhes da recarga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RechargeResponse'
        '401':
          description: Não autenticado
        '404':
          description: Recarga não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
          example: João Silva
        email:
          type: string
          format: email
          example: joao@email.com
        password:
          type: string
          minLength: 6
          maxLength: 100
          format: password
          example: senha123

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: joao@email.com
        password:
          type: string
          format: password
          example: senha123

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string

    UserResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string

    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          format: int64
          description: Tempo de expiração em segundos

    CreateRechargeRequest:
      type: object
      required:
        - phoneNumber
        - amount
      properties:
        phoneNumber:
          type: string
          pattern: '^\+?[1-9]\d{10,14}$'
          example: "+5511999999999"
        amount:
          type: number
          format: double
          minimum: 10.0
          maximum: 200.0
          example: 30.00

    RechargeResponse:
      type: object
      properties:
        id:
          type: string
        phoneNumber:
          type: string
        amount:
          type: number
          format: double
        status:
          $ref: '#/components/schemas/RechargeStatus'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RechargeStatus:
      type: string
      enum:
        - PENDING
        - PROCESSING
        - COMPLETED
        - FAILED

    RechargePageResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/RechargeResponse'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
        message:
          type: string
        timestamp:
          type: string
          format: date-time
